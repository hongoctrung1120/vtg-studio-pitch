<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vượt Thời Gian Studio</title>
<meta name="description" content="Bộ thuyết trình Vượt Thời Gian Studio — Trường Đại học Thành Đông">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Trình chiếu 14 slide ảnh 16:9 — điều khiển giống deck OPC (←/→, chạm, vuốt, F, R), thêm G = xem lưới */
:root {
  color-scheme: dark;
  --bg: #050A18;
  --gold: #D9A441;
  --ink: #F5EFE3;
  --muted: rgba(245, 239, 227, .7);
  --glass: rgba(10, 18, 40, .72);
  --line: rgba(217, 164, 65, .35);
  --ratio: 1.7768;           /* 1672 / 941 */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif; }
body { -webkit-user-select: none; user-select: none; touch-action: pan-y; }

/* Sân khấu */
.deck { position: fixed; inset: 0; }
.sl { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; visibility: hidden; transition: opacity .8s ease, visibility 0s linear .8s; }
.sl.on { opacity: 1; visibility: visible; transition: opacity .8s ease; z-index: 2; }
.sl .bd { position: absolute; inset: -40px; background: center / cover no-repeat; filter: blur(34px) brightness(.38) saturate(1.2); transform: scale(1.08); }
/* Không co giãn ảnh (zoom chậm làm chữ trong ảnh bị nhoè): ảnh luôn vẽ đúng kích thước khung */
.frame { position: relative; width: min(100vw, calc(100vh * var(--ratio))); width: min(100vw, calc(100dvh * var(--ratio))); aspect-ratio: 1672 / 941; overflow: hidden; box-shadow: 0 30px 90px rgba(0,0,0,.55); }
.frame > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/* Vệt sáng vàng quét qua khi vào slide */
.frame::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgba(255,214,140,.22) 48%, rgba(255,236,190,.32) 50%, rgba(255,214,140,.22) 52%, transparent 65%); transform: translateX(-120%); }
.play .sl.on .frame::after { animation: sweep 1.6s .25s ease-out both; }
@keyframes sweep { to { transform: translateX(120%); } }

/* Video thật đặt vào khung trống ở slide 4 (chỉ hiện khi có file trong thư mục video/) */
.vid { position: absolute; background: #000; display: none; cursor: pointer; z-index: 3; }
.vid.ok { display: block; }
.vid video { width: 100%; height: 100%; object-fit: contain; display: block; }
.vid .tag { position: absolute; left: 10px; bottom: 10px; padding: 4px 10px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); font-size: 12px; color: var(--ink); }
.vid.playing .tag { display: none; }

/* Bụi vàng */
canvas.dust { position: fixed; inset: 0; z-index: 4; pointer-events: none; }

/* Thanh tiến độ + HUD + gợi ý */
.bar { position: fixed; left: 0; top: 0; height: 3px; width: 0; z-index: 9; background: linear-gradient(90deg, #A8781F, var(--gold), #F6D88E); box-shadow: 0 0 12px rgba(217,164,65,.6); transition: width .6s cubic-bezier(.16,1,.3,1); }
.hud { position: fixed; right: 18px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10; display: flex; align-items: center; gap: 2px; padding: 5px 8px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); opacity: 0; transform: translateY(8px); transition: opacity .35s, transform .35s; }
.hud.on, .hud:focus-within { opacity: 1; transform: none; }
.hud button { width: 38px; height: 38px; border: 0; border-radius: 50%; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.hud button:hover { background: rgba(217,164,65,.18); color: var(--gold); }
.hud button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.hud svg { width: 18px; height: 18px; }
.pos { min-width: 62px; text-align: center; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
.hint { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 9; max-width: calc(100vw - 32px); padding: 8px 16px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); text-align: center; backdrop-filter: blur(10px); transition: opacity .6s; pointer-events: none; }
.hint b { color: var(--ink); }
.hint.gone { opacity: 0; }
.hint .phone { display: none; }
@media (hover: none) and (pointer: coarse) { .hint .desk { display: none; } .hint .phone { display: inline; } }
@media (max-width: 1000px) { .hint { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); } }

/* Lưới xem nhanh (G) */
.grid { position: fixed; inset: 0; z-index: 20; background: rgba(4,8,20,.94); backdrop-filter: blur(6px); overflow-y: auto; padding: 56px 16px 40px; display: none; }
.grid.on { display: block; }
.grid h2 { max-width: 1200px; margin: 0 auto 18px; font-size: 14px; font-weight: 600; letter-spacing: .2em; color: var(--gold); text-transform: uppercase; }
.grid .tiles { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.grid button { position: relative; border: 1px solid rgba(255,255,255,.08); border-radius: 8px; overflow: hidden; background: #000; cursor: pointer; padding: 0; aspect-ratio: 1672 / 941; }
.grid button img { width: 100%; height: 100%; object-fit: cover; display: block; }
.grid button span { position: absolute; left: 8px; top: 6px; font-size: 12px; font-weight: 700; color: var(--ink); text-shadow: 0 1px 4px #000; }
.grid button.cur { outline: 2px solid var(--gold); }
.grid button:focus-visible { outline: 2px solid var(--gold); }

@media (prefers-reduced-motion: reduce) {
  .play .sl.on .frame::after { animation: none; }
  .sl { transition: none; }
}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<canvas class="dust" id="dust" aria-hidden="true"></canvas>
<div class="bar" id="bar"></div>

<div class="hud" id="hud">
  <button id="prev" type="button" aria-label="Slide trước"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span class="pos" id="pos">1 / 14</span>
  <button id="next" type="button" aria-label="Slide sau"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <button id="gridBtn" type="button" aria-label="Xem tất cả slide (G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></button>
  <button id="fs" type="button" aria-label="Toàn màn hình (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div class="hint" id="hint">
  <span class="desk">Bấm <b>→</b> hoặc nhấn vào slide để chuyển · <b>F</b> toàn màn hình · <b>R</b> xem lại hiệu ứng · <b>G</b> xem tất cả</span>
  <span class="phone">Xoay ngang điện thoại để xem rõ hơn · <b>vuốt</b> hoặc chạm để chuyển slide</span>
</div>

<div class="grid" id="grid" role="dialog" aria-label="Tất cả slide"><h2>Vượt Thời Gian Studio · 14 slide</h2><div class="tiles" id="tiles"></div></div>

<script>
/* ---------- Danh sách slide ---------- */
const N = 14;
/* Ảnh gốc, giữ nguyên định dạng và độ phân giải (không nén lại) */
const SLIDES = ["img/slide01.jpg", "img/slide02.jpg", "img/slide03.jpg", "img/slide04.png", "img/slide05.png", "img/slide06.png", "img/slide07.png", "img/slide08.png", "img/slide09.png", "img/slide10.png", "img/slide11.png", "img/slide12.png", "img/slide13.png", "img/slide14.png"];
/* Ảnh nhỏ cho nền mờ và lưới xem nhanh; ảnh nét cao chỉ tải khi cần */
const THUMBS = SLIDES.map(s => s.replace('img/', 'img/thumb/').replace(/\.png$/, '.jpg'));
/* Mã phiên bản: đổi mỗi lần thay ảnh để trình duyệt không dùng bản cũ */
const V = '?v=20261009a';
for (let i = 0; i < SLIDES.length; i++) { SLIDES[i] += V; THUMBS[i] += V; }
/* Phim thật cho khung dọc 9:16 ở slide 4 — đặt file vào thư mục video/ với đúng tên dưới đây */
const VIDEOS = {
  4: [
    { src: 'video/phim-mung-tho.mp4', label: 'Phim mừng thọ', box: [75.359, 31.562, 18.301, 58.661] }
  ]
};

const deck = document.getElementById('deck'), hud = document.getElementById('hud'), hint = document.getElementById('hint');
const pos = document.getElementById('pos'), bar = document.getElementById('bar');
const grid = document.getElementById('grid'), tiles = document.getElementById('tiles');

const slides = SLIDES.map((src, i) => {
  const n = i + 1;
  const s = document.createElement('section');
  s.className = 'sl'; s.setAttribute('aria-label', 'Slide ' + n);
  const bd = document.createElement('div'); bd.className = 'bd'; bd.style.backgroundImage = 'url(' + THUMBS[i] + ')';
  const fr = document.createElement('div'); fr.className = 'frame';
  const img = document.createElement('img'); img.dataset.src = src; img.alt = 'Slide ' + n; img.decoding = 'async'; img.draggable = false;
  fr.appendChild(img);
  (VIDEOS[n] || []).forEach(v => {
    const box = document.createElement('div'); box.className = 'vid';
    const [l, t, w, h] = v.box;
    Object.assign(box.style, { left: l + '%', top: t + '%', width: w + '%', height: h + '%' });
    const vd = document.createElement('video'); vd.src = v.src; vd.preload = 'metadata'; vd.playsInline = true;
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = '▶ ' + v.label;
    vd.addEventListener('loadedmetadata', () => box.classList.add('ok'));
    vd.addEventListener('error', () => box.remove());          // chưa có file → giữ nguyên khung trống trong ảnh
    vd.addEventListener('play', () => box.classList.add('playing'));
    vd.addEventListener('pause', () => box.classList.remove('playing'));
    box.addEventListener('click', e => { e.stopPropagation(); vd.paused ? vd.play() : vd.pause(); });
    box.addEventListener('dblclick', e => { e.stopPropagation(); if (box.requestFullscreen) box.requestFullscreen().catch(() => {}); });
    box.append(vd, tag); fr.appendChild(box);
  });
  s.append(bd, fr); deck.appendChild(s);

  const t = document.createElement('button'); t.type = 'button'; t.setAttribute('aria-label', 'Tới slide ' + n);
  t.innerHTML = '<img alt="" loading="lazy"><span></span>';
  t.querySelector('img').src = THUMBS[i]; t.querySelector('span').textContent = n;
  t.addEventListener('click', () => { closeGrid(); go(i); });
  tiles.appendChild(t);
  return s;
});

/* ---------- Điều hướng ---------- */
let cur = -1, hideTimer = 0;
function replay() {
  document.body.classList.remove('play'); void document.body.offsetWidth; document.body.classList.add('play');
  burst();
}
function want(i) {
  const im = slides[i] && slides[i].querySelector('.frame > img');
  if (im && !im.src) im.src = im.dataset.src;
}
let warmed = false;
function warmAll() {
  if (warmed) return; warmed = true;
  let k = 0;
  (function step() { if (k >= N) return; want(k++); setTimeout(step, 400); })();
}
function stopVideos(except) { deck.querySelectorAll('video').forEach(v => { if (v !== except) v.pause(); }); }
function go(n) {
  n = Math.max(0, Math.min(N - 1, n));
  if (n === cur) return;
  if (cur >= 0) slides[cur].classList.remove('on');
  cur = n; want(n); want(n + 1); want(n - 1);
  slides[n].classList.add('on');
  setTimeout(warmAll, 2500);
  stopVideos();
  pos.textContent = (n + 1) + ' / ' + N;
  bar.style.width = ((n + 1) / N * 100) + '%';
  [...tiles.children].forEach((t, k) => t.classList.toggle('cur', k === n));
  try { history.replaceState(null, '', '#' + (n + 1)); } catch (e) {}
  replay();
}
function toggleFs() {
  const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  if (p && p.catch) p.catch(() => {});
}
function showHud() { hud.classList.add('on'); clearTimeout(hideTimer); hideTimer = setTimeout(() => hud.classList.remove('on'), 2500); }
function openGrid() { grid.classList.add('on'); (tiles.children[cur] || tiles.children[0]).focus(); }
function closeGrid() { grid.classList.remove('on'); }

const NEXT = ['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'], PREV = ['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'];
addEventListener('keydown', e => {
  if (grid.classList.contains('on')) { if (e.key === 'Escape' || e.key === 'g' || e.key === 'G') closeGrid(); return; }
  if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  if (NEXT.includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (PREV.includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(N - 1);
  else if (e.key === 'f' || e.key === 'F') toggleFs();
  else if (e.key === 'r' || e.key === 'R') replay();
  else if (e.key === 'g' || e.key === 'G') openGrid();
});
/* Chạm/nhấp: 1/3 trái = lùi, còn lại = tới. Vuốt ngang để chuyển. */
let tx = 0, ty = 0, swiped = false;
deck.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; swiped = false; }, { passive: true });
deck.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { swiped = true; go(cur + (dx < 0 ? 1 : -1)); }
}, { passive: true });
deck.addEventListener('click', e => { if (swiped) { swiped = false; return; } go(cur + (e.clientX < innerWidth / 3 ? -1 : 1)); });
addEventListener('mousemove', showHud);
document.getElementById('prev').addEventListener('click', () => go(cur - 1));
document.getElementById('next').addEventListener('click', () => go(cur + 1));
document.getElementById('fs').addEventListener('click', toggleFs);
document.getElementById('gridBtn').addEventListener('click', openGrid);
grid.addEventListener('click', e => { if (e.target === grid) closeGrid(); });
setTimeout(() => hint.classList.add('gone'), 6000);

/* ---------- Bụi vàng (nhẹ, tắt khi người xem chọn giảm chuyển động) ---------- */
const cv = document.getElementById('dust'), cx = cv.getContext('2d');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
let P = [];
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
function seed(k) { return { x: Math.random() * cv.width, y: cv.height * (.35 + Math.random() * .7), r: (Math.random() * 1.6 + .5) * devicePixelRatio, v: (Math.random() * .35 + .12) * devicePixelRatio, a: 0, life: 0, max: 260 + Math.random() * 300, k }; }
function burst() { if (calm) return; for (let i = 0; i < 18; i++) P.push(seed(1)); }
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  if (P.length < 34) P.push(seed(0));
  P = P.filter(p => p.life < p.max);
  for (const p of P) {
    p.life++; p.y -= p.v; p.x += Math.sin((p.life + p.y) / 60) * .25 * devicePixelRatio;
    const t = p.life / p.max; p.a = Math.sin(Math.PI * t) * (p.k ? .75 : .45);
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.283);
    cx.fillStyle = 'rgba(246,216,142,' + p.a.toFixed(3) + ')'; cx.shadowColor = 'rgba(217,164,65,.9)'; cx.shadowBlur = 8 * devicePixelRatio; cx.fill();
  }
  requestAnimationFrame(tick);
}
addEventListener('resize', size); size();
if (!calm) requestAnimationFrame(tick);

/* ---------- Mở đúng slide theo #số ---------- */
const fromHash = () => { const m = /^#(\d{1,2})$/.exec(location.hash); const k = m ? +m[1] - 1 : 0; return k >= 0 && k < N ? k : 0; };
addEventListener('hashchange', () => go(fromHash()));
go(fromHash());
showHud();
</script>
</body>
</html>
